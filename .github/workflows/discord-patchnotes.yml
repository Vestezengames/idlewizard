name: Send patch notes to Discord

on:
  push:
    branches:
      - main
    paths:
      - "version.json"
      - ".github/workflows/discord-patchnotes.yml"
  workflow_dispatch:

jobs:
  send-patchnotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send patch notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PATCH_WEBHOOK }}
        run: |
          python3 << 'PY'
          import json

          with open("version.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          latest = data.get("latest", "Unknown version")
          message = data.get("message", "").replace("\\n", "\n")

          discord_message = (
              f"**Idle Wizard: Magic Ascension - Update {latest}**\n"
              f"{message}"
          )

          payload = {
              "content": discord_message
          }

          with open("discord_payload.json", "w", encoding="utf-8") as file:
              json.dump(payload, file)
          PY

          curl -f -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @discord_payload.json